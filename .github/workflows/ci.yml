name: CI

# Quality gate for every PR and pushes to the long-lived branches.
# Hard gates (fail the run): lint, typecheck, test, dependency audit (high+),
# secret scan (gitleaks).
# Informational (continue-on-error): format drift, next build — signal without
# blocking merges while the repo is being cleaned up.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # --- Hard gates -------------------------------------------------------
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # --- Informational (do not block) ------------------------------------
      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # --- Hard gate: dependency audit (production deps) -------------------
      # Fails the run on high/critical advisories in the shipped dependency
      # tree. Dev-only tooling (eslint, patch-package, vitest, ...) is audited
      # separately below without blocking, because those chains regularly
      # carry advisories with no upstream fix (e.g. braces via patch-package)
      # and never reach production. If a production fix isn't yet available
      # upstream, triage with `npm audit --omit=dev` locally and add a scoped
      # override rather than reverting this gate.
      - name: Dependency audit (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit (dev, informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
