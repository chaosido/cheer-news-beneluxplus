version: 2
updates:
  # npm dependencies — weekly, grouped to keep PR noise low.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot updates
  # the pin and the trailing version comment together). Grouped into ONE PR:
  # multi-step actions like codeql-action (init + analyze) must move in
  # lockstep — separate per-step PRs leave the two steps on different versions
  # and CodeQL fails with a config/runner version mismatch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
